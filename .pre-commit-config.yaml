# Local guardrails. Preferred full check:
#   mise run validate
# Install hooks once:
#   uvx pre-commit==4.2.0 install
# Refresh pinned versions anytime (gitleaks is pinned in mise.toml instead):
#   pre-commit autoupdate
# Run against everything manually:
#   uvx pre-commit==4.2.0 run --all-files

repos:
  - repo: local
    hooks:
      # Blocks commits containing secrets / tokens. Runs the mise-pinned binary
      # (mise.toml); the upstream hook builds gitleaks with Go.
      - id: gitleaks
        name: gitleaks
        entry: mise exec -- gitleaks git --pre-commit --redact --staged --verbose --no-banner
        language: system
        pass_filenames: false

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck        # lints scripts/*.sh

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: ["--maxkb=500"]
